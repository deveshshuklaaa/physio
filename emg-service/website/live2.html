<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>EMG Monitor Pro - Real-Time Analysis</title>

<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        /* Custom scrollbar for clinical density */

        ::-webkit-scrollbar-track { background: #0d1518; }
        ::-webkit-scrollbar-thumb { background: #3a4a43; border-radius: 2px; }

            filter: drop-shadow(0 0 4px rgba(0, 225, 171, 0.4));

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .alert-pulse { animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>

        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-base overflow-hidden select-none">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-low border-b border-outline-variant flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim" data-icon="settings_input_component">settings_input_component</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary-container tracking-tighter">EMG MONITOR PRO</h1>
</div>
<div class="flex items-center gap-2 px-3 py-1 bg-surface-container-highest rounded-full border border-outline-variant">
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,255,194,0.6)]"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">CONNECTED</span>
</div>
</header>
<!-- Main Viewport -->
<main class="pt-16 pb-20 h-screen flex flex-col overflow-hidden">
<!-- Graph Area (Locked at top half for mobile) -->
<section class="flex-1 min-h-[353px] relative bg-surface-container-lowest overflow-hidden">
<!-- Grid Overlay -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(#3a4a43 1px, transparent 1px), linear-gradient(to right, #3a4a43 1px, transparent 1px), linear-gradient(to bottom, #3a4a43 1px, transparent 1px); background-size: 20px 20px;">
</div>
<!-- Labels and Status Overlay -->
<div class="absolute top-4 left-margin-mobile z-10 flex flex-col gap-2">
<div class="flex items-center gap-2 bg-background/80 backdrop-blur-xl px-2 py-1 rounded border border-outline-variant">
<span class="font-label-caps text-label-caps text-primary-fixed-dim">SIGNAL: CH1</span>
<span class="font-label-caps text-label-caps bg-primary-container text-on-primary-container px-1.5 rounded" id="live-badge">LIVE</span>
</div>
</div>
<div class="absolute top-4 right-margin-mobile z-10 text-right">
<div class="font-data-sm text-data-sm text-on-surface-variant opacity-60">REF: 0.00V</div>
<div class="font-data-lg text-data-lg text-primary-fixed-dim tabular-nums" id="instant-voltage">0.24mV</div>
</div>
<!-- Canvas for Real-time signal -->
<canvas class="w-full h-full cursor-crosshair" id="emgCanvas"></canvas>
<!-- Tonal gradient at bottom of trace -->
<div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-background to-transparent pointer-events-none"></div>
</section>
<!-- Metrics & Controls Section (Scrollable on small screens) -->
<section class="bg-surface border-t border-outline-variant p-margin-mobile grid grid-cols-2 gap-4 overflow-y-auto">
<!-- Data Cards -->
<div class="bg-surface-container p-3 rounded-lg border border-outline-variant hover:bg-surface-container-high transition-colors">
<header class="font-label-caps text-label-caps text-on-surface-variant mb-1">RMS AMPLITUDE</header>
<div class="font-data-lg text-data-lg text-on-surface" id="rms-value">142.8</div>
<div class="h-1 w-full bg-surface-container-highest mt-2 rounded-full overflow-hidden">
<div class="h-full bg-secondary-container transition-all duration-300" id="rms-bar" style="width: 65%"></div>
</div>
</div>
<div class="bg-surface-container p-3 rounded-lg border border-outline-variant hover:bg-surface-container-high transition-colors">
<header class="font-label-caps text-label-caps text-on-surface-variant mb-1">PEAK FREQ</header>
<div class="font-data-lg text-data-lg text-on-surface">84.2 <span class="text-xs text-on-surface-variant">Hz</span></div>
<div class="flex gap-1 mt-2">
<div class="h-4 w-2 bg-primary-container opacity-40"></div>
<div class="h-4 w-2 bg-primary-container opacity-60"></div>
<div class="h-4 w-2 bg-primary-container"></div>
<div class="h-4 w-2 bg-primary-container opacity-20"></div>
</div>
</div>
<!-- Gain Control Slider -->
<div class="col-span-2 bg-surface-container p-4 rounded-lg border border-outline-variant">
<div class="flex justify-between items-center mb-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">ANALOG GAIN MULTIPLIER</span>
<span class="font-data-sm text-data-sm text-primary-fixed-dim" id="gain-label">x250</span>
</div>
<input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary-container" id="gain-slider" max="500" min="10" type="range" value="250"/>
</div>
<!-- Warning Banner (Conditional example) -->
<div class="col-span-2 flex items-center gap-3 bg-error-container/20 border border-error-container/40 p-3 rounded-lg alert-pulse">
<span class="material-symbols-outlined text-error" data-icon="warning">warning</span>
<span class="font-label-caps text-label-caps text-error">MUSCLE FATIGUE THRESHOLD DETECTED</span>
</div>
</section>
</main>
<!-- Bottom Navigation Controls -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface-container-high border-t border-outline-variant shadow-lg px-margin-mobile pb-safe">
<!-- Pause / Resume -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed active:scale-90 transition-transform duration-150" id="btn-pause">
<span class="material-symbols-outlined" data-icon="pause_circle">pause_circle</span>
<span class="font-label-caps text-label-caps">Pause</span>
</button>
<!-- Record (Active State Logic applied if recording) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed active:scale-90 transition-transform duration-150" id="btn-record">
<span class="material-symbols-outlined" data-icon="fiber_manual_record" id="record-icon">fiber_manual_record</span>
<span class="font-label-caps text-label-caps" id="record-text">Record</span>
</button>
<!-- Gain (Nav placeholder as requested in labels) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
<span class="font-label-caps text-label-caps">Gain</span>
</button>
<!-- Export -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="file_download">file_download</span>
<span class="font-label-caps text-label-caps">Export</span>
</button>
</nav>
<script>
        const canvas = document.getElementById('emgCanvas');
        const ctx = canvas.getContext('2d');
        const pauseBtn = document.getElementById('btn-pause');
        const recordBtn = document.getElementById('btn-record');
        const gainSlider = document.getElementById('gain-slider');
        const gainLabel = document.getElementById('gain-label');
        const voltageDisplay = document.getElementById('instant-voltage');
        const liveBadge = document.getElementById('live-badge');
        const rmsValueText = document.getElementById('rms-value');
        const rmsBar = document.getElementById('rms-bar');

        let isPaused = false;
        let isRecording = false;
        let gain = 250;
        let dataPoints = [];
        const maxPoints = 500;
        let animationFrame;

        // Initialize Canvas Size
        function resize() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resize);
        resize();

        // EMG Simulation Math
        let time = 0;
        function getEMGSignal() {
            // Base noise
            let base = (Math.random() - 0.5) * 0.1;
            
            // Random bursts (simulating muscle firing)
            let burst = 0;
            if (Math.sin(time * 0.05) > 0.8) {
                burst = (Math.random() - 0.5) * 1.2 * (Math.random() + 0.2);
            }
            
            // Occasional high frequency artifact
            let artifact = Math.sin(time * 2.5) * 0.05;
            
            time += 1;
            return (base + burst + artifact);
        }

        function draw() {
            if (isPaused) return;

            const val = getEMGSignal();
            dataPoints.push(val);
            if (dataPoints.length > maxPoints) dataPoints.shift();

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Trace
            ctx.beginPath();
            ctx.strokeStyle = '#00e1ab';
            ctx.lineWidth = 2.5 * window.devicePixelRatio;
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'rgba(0, 225, 171, 0.5)';

            const step = canvas.width / maxPoints;
            const midY = canvas.height / 2;

            dataPoints.forEach((p, i) => {
                const x = i * step;
                const y = midY - (p * gain * (canvas.height / 1000));
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.stroke();

            // Update UI periodically
            if (time % 5 === 0) {
                const displayVal = (val * 1.5).toFixed(2);
                voltageDisplay.innerText = `${displayVal}mV`;
                
                // Calc dummy RMS
                const rms = Math.abs(val * gain * 0.8).toFixed(1);
                rmsValueText.innerText = rms;
                rmsBar.style.width = `${Math.min(100, rms / 2)}%`;
            }

            animationFrame = requestAnimationFrame(draw);
        }

        // Control Logic
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            const icon = pauseBtn.querySelector('.material-symbols-outlined');
            const text = pauseBtn.querySelector('span:last-child');
            
            if (isPaused) {
                icon.innerText = 'play_circle';
                text.innerText = 'Resume';
                cancelAnimationFrame(animationFrame);
                liveBadge.classList.replace('bg-primary-container', 'bg-surface-container-highest');
                liveBadge.classList.replace('text-on-primary-container', 'text-on-surface-variant');
                liveBadge.innerText = 'PAUSED';
            } else {
                icon.innerText = 'pause_circle';
                text.innerText = 'Pause';
                liveBadge.classList.replace('bg-surface-container-highest', 'bg-primary-container');
                liveBadge.classList.replace('text-on-surface-variant', 'text-on-primary-container');
                liveBadge.innerText = 'LIVE';
                draw();
            }
        });

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            const icon = recordBtn.querySelector('.material-symbols-outlined');
            const container = recordBtn;
            
            if (isRecording) {
                icon.classList.add('text-on-tertiary-container');
                icon.style.fontVariationSettings = "'FILL' 1";
                container.classList.add('bg-tertiary-container/10', 'rounded-xl', 'px-2');
                document.getElementById('record-text').innerText = 'Stop';
            } else {
                icon.classList.remove('text-on-tertiary-container');
                icon.style.fontVariationSettings = "'FILL' 0";
                container.classList.remove('bg-tertiary-container/10', 'rounded-xl', 'px-2');
                document.getElementById('record-text').innerText = 'Record';
            }
        });

        gainSlider.addEventListener('input', (e) => {
            gain = e.target.value;
            gainLabel.innerText = `x${gain}`;
        });

        // Start initial loop
        draw();
    </script>
</body></html>
