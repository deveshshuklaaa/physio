                    "secondary": "#bdf4ff",

<script src="components.js"></script>
</head>
<body class="bg-background text-on-surface font-body-base select-none">
<emg-nav active="history"></emg-nav>
<!-- Main Content Area -->
<main class="flex-1 px-margin-mobile py-6 max-w-container-max mx-auto w-full">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 flex items-center gap-2">
<span class="w-1 h-1 bg-primary rounded-full"></span>
            RECORDINGS
        </h2>
<div id="prune-notice" class="hidden mb-4 p-3 rounded-lg bg-surface-container border border-outline-variant flex items-start justify-between gap-3">
<p id="prune-notice-text" class="font-data-sm text-data-sm text-on-surface-variant"></p>
<button class="text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform shrink-0" onclick="document.getElementById('prune-notice').classList.add('hidden')">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
<div id="recordings-list" class="space-y-4">
    <!-- Loading placeholder -->
    <p class="text-center py-8 text-on-surface-variant">Loading recordings...</p>
</div>
</main>
<!-- Floating Action Button - Only for Recording History/Home context -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-primary-container text-on-primary-container rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-40" onclick="window.location.href='live.html'">
<span class="material-symbols-outlined scale-125" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
<script>
        // mm:ss (or h:mm:ss) from seconds. Falls back to size for old
        // entries recorded before duration was tracked.
        function formatDuration(seconds, sizeBytes) {
            if (typeof seconds !== 'number' || isNaN(seconds)) {
                return sizeBytes ? `${(sizeBytes / (1024*1024)).toFixed(1)} MB` : '—';
            }
            const s = Math.round(seconds);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            const mm = String(m).padStart(h ? 2 : 1, '0');
            const ss = String(sec).padStart(2, '0');
            return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
        }

        // Build SVG path from points array (normalized to viewBox 0 0 100 40)
        function buildSparklinePath(points) {
            if (!points || points.length === 0) return 'M0 20 Q 20 0 40 20 T 60 20 T 80 20 100 20';
            const maxVal = Math.max(...points, 1);
            const stepX = 100 / (points.length - 1);
            let path = `M0 ${40 - (points[0] / maxVal) * 30}`;
            for (let i = 1; i < points.length; i++) {
                const x = i * stepX;
                const y = 40 - (points[i] / maxVal) * 30;
                path += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
            }
            return path;
        }

        // Delete a recording (with confirmation) and remove its card on success.
        async function deleteRecording(filename, cardEl) {
            if (!confirm(`Delete recording "${filename}"? This cannot be undone.`)) return;
            try {
                const res = await fetch(`/api/recording/${encodeURIComponent(filename)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
                cardEl.remove();
            } catch (err) {
                alert(`Failed to delete "${filename}": ${err.message}`);
            }
        }

        // Remove history entries whose files are gone from disk; surface what was cleaned up.
        async function pruneHistory() {
            try {
                const res = await fetch('/api/prune_history', { method: 'POST' });
                if (!res.ok) return;
                const { removed } = await res.json();
                if (removed && removed.length > 0) {
                    const notice = document.getElementById('prune-notice');
                    const text = document.getElementById('prune-notice-text');
                    text.textContent = `${removed.length} recording${removed.length === 1 ? '' : 's'} no longer on disk — removed from history: ${removed.join(', ')}`;
                    notice.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Prune failed:', err);
            }
        }

        // Fetch recordings from API and render list
        async function loadRecordings() {
            const container = document.getElementById('recordings-list');
            try {
                const response = await fetch('/api/list_recordings');
                if (!response.ok) throw new Error('Failed to fetch recordings');
                const recordings = await response.json();
                if (recordings.length === 0) {
                    container.innerHTML = '<p class="text-center py-8 text-on-surface-variant">No recordings found.</p>';
                    return;
                }
                // Sort by timestamp descending (newest first)
                recordings.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                let html = '';
                recordings.forEach(rec => {
                    const date = new Date(rec.timestamp);
                    const formatted = date.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const durationLabel = formatDuration(rec.duration, rec.size);
                    html += `
<div class="bg-surface-container-low rounded-xl border border-outline-variant overflow-hidden hover:border-outline transition-colors group" data-filename="${rec.filename}">
<div class="p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-[18px]" data-icon="timelapse">timelapse</span>
<span class="font-label-caps text-[10px]">${formatted}</span>
</div>
<h3 class="font-data-sm text-data-sm text-primary mb-1">${rec.filename}</h3>
<div class="flex items-center gap-3">
<span class="flex items-center gap-1 text-on-surface-variant font-label-caps text-[10px]">
<span class="material-symbols-outlined text-[14px]" data-icon="timer">timer</span> ${durationLabel}
                            </span>
</div>
</div>
<!-- Sparkline Preview -->
<div class="h-16 w-full md:w-48 bg-surface-container-lowest rounded border border-outline-variant grid-bg relative overflow-hidden">
<svg class="absolute inset-0 w-full h-full sparkline-svg" viewbox="0 0 100 40">
<path class="stroke-[var(--primary, #00ffc2)] stroke-[1.5] fill-none" d="M0 20 Q 20 0 40 20 T 60 20 T 80 20 100 20"></path>
</svg>
</div>
<div class="flex items-center gap-1 justify-end">
<button class="p-2 hover:bg-surface-variant rounded-full text-on-surface-variant transition-colors" onclick="window.location.href='playback.html?file=${encodeURIComponent(rec.filename)}'">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
</button>
<button class="delete-btn p-2 hover:bg-error-container hover:text-error rounded-full text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</div>
                    `;
                });
                container.innerHTML = html;

                // Second async pass: fetch real sparklines for each card, and wire up delete
                document.querySelectorAll('[data-filename]').forEach(card => {
                    const filename = card.dataset.filename;
                    const svg = card.querySelector('.sparkline-svg');
                    fetch(`/api/preview/${encodeURIComponent(filename)}?points=48`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.points) {
                                const path = buildSparklinePath(data.points);
                                svg.querySelector('path').setAttribute('d', path);
                            }
                        })
                        .catch(err => console.error('Preview fetch failed for', filename, err));

                    card.querySelector('.delete-btn').addEventListener('click', () => deleteRecording(filename, card));
                });
            } catch (err) {
                console.error('Error loading recordings:', err);
                container.innerHTML = `<p class="text-center py-8 text-on-surface-variant">Error loading recordings: ${err.message}</p>`;
            }
        }
        // Load on page load: prune stale history entries first, then list what remains.
        window.addEventListener('DOMContentLoaded', async () => {
            await pruneHistory();
            loadRecordings();
        });
    </script>
</body></html>
