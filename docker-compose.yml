services:
  emg-service:
    build:
      context: ./emg-service
    # APP-010: profile-gated -- config stays, container does NOT start by default.
    # Start deliberately with `docker compose --profile emg up -d emg-service`.
    # Image layers cost disk; a stopped service costs no RAM, no CPU, no port.
    profiles: ["emg"]
    # D27: internal only, NO http host port and no nginx location -- permanently
    # unreachable from a browser. Reached at http://emg-service:5000 from inside
    # the compose network. Bench access is `docker compose exec`, never an nginx
    # location.
    environment:
      # Q49/D5: app.py's DATA_DIR defaults to BASE_DIR/.. == /srv in the
      # container, i.e. recordings land next to the code and a rebuild destroys
      # them. Point it at the mounted directory instead. Requires app.py to read
      # this env var (see docs/12 §7.3).
      EMG_DATA_DIR: /srv/data
    volumes:
      # Q49: recordings, history.json and progress_cache.json survive a rebuild.
      # Bind mount, not a named volume, so the R4 demo recordings are visible in
      # the repo and seedable by copying files in.
      - ./emg-service/data:/srv/data
    ports:
      # Q26: the band streams UDP to 8888. Without this the container receives
      # nothing -- this worked before only because Flask ran on the host, not in
      # compose. TCP 5000 stays unpublished (D27).
      - "8888:8888/udp"
    restart: unless-stopped
    mem_limit: 512m

  backend:
    build:
      context: ./backend
    # G2-B2/G2-D2: JWT_SECRET must be the SAME value theirs uses (we verify
    # their tokens, we never issue any) and MONGO_URI the same Atlas cluster.
    # Both come from their .env, and both fail loudly at import if unset --
    # the backend will not boot without this file.
    env_file:
      - ./.env
      - ./.env.secrets
    environment:
      # K2 -- compose hostname, not localhost. localhost inside this
      # container is the backend itself.
      EMG_SERVICE_URL: "http://emg-service:5000"
    volumes:
      - ./data/trained_models:/app/ml/trained_models
      - ./data/backend_logs:/app/logs
    # APP-010: `depends_on: emg-service` removed -- emg-service is now profile-gated
    # and depends_on would drag it up with every `compose up`. Ordering was never
    # the real guarantee anyway: the backend reaches EMG over EMG_SERVICE_URL at
    # request time and already has its own circuit breaker for an absent service.
    # G2-A3: no host port. Reached through nginx at /engine/* and /ws/*.
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    # G2-A3: no host port. Reached through nginx at /dist/*, /src/*, /assets/*.
    restart: unless-stopped
    mem_limit: 256m

  hemo-backend:
    build:
      context: ./part2/Hemophillia-confirm/backend
    env_file:
      - ./.env
      - ./.env.secrets
    environment:
      # G2-A CSFLE: mount path below must match this. Same tarball referenced
      # in docs/09g_g2_0_resolutions.md, now an x86_64 build (that doc's
      # aarch64 blocker is resolved).
      CRYPT_SHARED_LIB_PATH: /csfle/mongo_crypt_v1.so
    volumes:
      - ./mongo_crypt_shared_v1-linux-x86_64-enterprise-amazon2023-8.3.9/lib/mongo_crypt_v1.so:/csfle/mongo_crypt_v1.so:ro
    # G2-0.1/G2-0.3: no local `mongo` service -- this project's data lives on
    # MongoDB Atlas (MONGO_URI in .env). A local container would be an empty
    # database nothing reads from. §1 of the plan lists mongo:27017; skipped
    # deliberately, not an oversight.
    # No host port. Reached through nginx at /api/*.
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hemo-frontend:
    build:
      context: ./part2/Hemophillia-confirm/frontend
      args:
        VITE_GOOGLE_CLIENT_ID: "889563848205-594fg6vth8pb3a9v09suf2qgjvstoiaq.apps.googleusercontent.com"
    depends_on:
      - hemo-backend
    # No host port. Reached through nginx at /.
    restart: unless-stopped
    mem_limit: 256m

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      hemo-backend:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      hemo-frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m



  hemo-backend-stage:
    build:
      context: ./part2/Hemophillia-confirm/backend
    # APP-010: profile-gated -- config preserved, container does NOT start by
    # default. Start deliberately with
    # `docker compose --profile stage up -d hemo-backend-stage`.
    # Needed for the DB_MIGRATION_PLAN Phase 9 dry run (APP-C9), not for serving.
    profiles: ["stage"]
    env_file:
      - ./.env
      - ./.env.secrets
    environment:
      CRYPT_SHARED_LIB_PATH: /csfle/mongo_crypt_v1.so
      MONGO_URI: ${MONGO_URI_STAGE}
    volumes:
      - ./mongo_crypt_shared_v1-linux-x86_64-enterprise-amazon2023-8.3.9/lib/mongo_crypt_v1.so:/csfle/mongo_crypt_v1.so:ro
    ports:
      - "5001:5000"
    restart: unless-stopped
    mem_limit: 4g
