services:
  emg-service:
    build:
      context: ./emg-service
    # G2-A3: internal only, no host port. Reached at http://emg-service:5000
    # from inside the compose network.

  backend:
    build:
      context: ./backend
    # G2-B2/G2-D2: JWT_SECRET must be the SAME value theirs uses (we verify
    # their tokens, we never issue any) and MONGO_URI the same Atlas cluster.
    # Both come from their .env, and both fail loudly at import if unset --
    # the backend will not boot without this file.
    env_file:
      - ./part2/Hemophillia-confirm/backend/.env
    environment:
      # K2 -- compose hostname, not localhost. localhost inside this
      # container is the backend itself.
      EMG_SERVICE_URL: "http://emg-service:5000"
    depends_on:
      - emg-service
    # G2-A3: no host port. Reached through nginx at /engine/* and /ws/*.

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    # G2-A3: no host port. Reached through nginx at /dist/*, /src/*, /assets/*.

  hemo-backend:
    build:
      context: ./part2/Hemophillia-confirm/backend
    env_file:
      - ./part2/Hemophillia-confirm/backend/.env
    environment:
      # G2-A CSFLE: mount path below must match this. Same tarball referenced
      # in docs/09g_g2_0_resolutions.md, now an x86_64 build (that doc's
      # aarch64 blocker is resolved).
      CRYPT_SHARED_LIB_PATH: /csfle/mongo_crypt_v1.so
    volumes:
      - ./mongo_crypt_shared_v1-linux-x86_64-enterprise-amazon2023-8.3.9/lib/mongo_crypt_v1.so:/csfle/mongo_crypt_v1.so:ro
    # G2-0.1/G2-0.3: no local `mongo` service -- this project's data lives on
    # MongoDB Atlas (MONGO_URI in .env). A local container would be an empty
    # database nothing reads from. §1 of the plan lists mongo:27017; skipped
    # deliberately, not an oversight.
    # No host port. Reached through nginx at /api/*.

  hemo-frontend:
    build:
      context: ./part2/Hemophillia-confirm/frontend
    depends_on:
      - hemo-backend
    # No host port. Reached through nginx at /.

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - hemo-backend
      - hemo-frontend
