# One origin (G2-A / D1). nginx is the only published port; everything else
# is an internal compose hostname.

client_max_body_size 200m;  # session video upload lands here in G2-F

# /api/*  -> hemo-backend, routes are already mounted at /api/... (index.js),
#            no prefix strip.
# /engine/* -> our FastAPI, whose routes are mounted at the bare root
#            (/session/..., /health, /exercises) -- strip the prefix.
# /ws/*   -> our FastAPI's websocket route IS /ws/session/{id} already, no
#            strip, but needs the Upgrade/Connection dance or it silently
#            fails to connect.
# /assets/* is deliberately NOT routed here: both Vite apps would emit it,
#            so ours is based under /dist/ and the root /assets/ falls
#            through to their SPA below.

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://hemo-backend:5000;
    }

    # D29 TEMPORARY -- 2026-09-22 demo only, owner-approved loosening of D27.
    # Exposes the Flask EMG service so the patient profile can show real
    # recordings and a real dashboard. UNSCOPED and UNAUTHENTICATED (S2/S12):
    # every caller sees every recording. Acceptable ONLY because the demo data
    # belongs to one real person. See docs/security.md S12, S2.
    # REVERT AFTER THE DEMO: delete this whole location block.
    location /emg/ {
        # Reads only. Blocks /emg/api/start_capture, /stop_recording and
        # /recalibrate, which are unauthenticated (S2) and would otherwise let
        # anyone on the network stop a recording mid-session.
        limit_except GET {
            deny all;
        }
        proxy_pass http://emg-service:5000/;
    }

    location /engine/ {
        proxy_pass http://backend:8000/;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The engine client. Its hashed assets (/dist/assets/*) are immutable and
    # cache freely, but the entry HTML and the vanilla /src/ modules are
    # served by a plain http.server with no cache headers at all -- browsers
    # then hold a stale session_orchestrator.js across a rebuild, which looks
    # exactly like "the fix didn't work". Pin those to no-store.
    location /dist/assets/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /dist/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "no-store" always;
    }

    location /src/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "no-store" always;
    }

    # Their SPA. http.server has no history-mode fallback, so a 404 on a
    # client route gets retried against index.html here.
    location / {
        proxy_pass http://hemo-frontend:3000;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://hemo-frontend:3000;
    }
}
